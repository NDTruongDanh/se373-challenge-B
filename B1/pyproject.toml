[project]
name = "se373-b1-compact"
version = "0.1.0"
description = "Challenge B1: Compact — keep context small while agent still gets the job done"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
